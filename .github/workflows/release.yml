name: Release

# Deux façons de publier une version (dans les deux cas : mettre d'abord à jour `version` dans
# Cargo.toml, section [workspace.package], et fusionner dans main) :
#
#  1. Depuis GitHub, sans ligne de commande : onglet Actions -> « Release » -> « Run workflow »,
#     indiquer la version (ex. v0.2.0).
#  2. En poussant une étiquette :  git tag v0.2.0 && git push origin v0.2.0
#
# Le workflow compile les installeurs (Windows, macOS Intel + Apple Silicon, Linux), signe les
# mises à jour et prépare une release **brouillon** : relisez-la puis cliquez sur « Publish release ».
# Les applications installées ne voient la nouvelle version qu'après cette publication.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Version à publier, par exemple v0.1.0 (doit correspondre à `version` dans Cargo.toml)"
        required: true
        default: v0.1.0

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Étiquette de la version : saisie du bouton « Run workflow », sinon nom de l'étiquette poussée.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: La clé publique de l'updater a bien été renseignée
        run: |
          if grep -q "REMPLACER_PAR_LA_CLE_PUBLIQUE" src-tauri/tauri.conf.json; then
            echo "::error file=src-tauri/tauri.conf.json::Remplacez 'pubkey' par la clé publique générée avec 'npx tauri signer generate' (voir docs/developpement.md)."
            exit 1
          fi
      - name: La version demandée correspond à celle du code
        run: |
          code_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          case "$TAG" in v[0-9]*) ;; *) echo "::error::La version doit ressembler à v0.1.0 (reçu : « $TAG »)."; exit 1;; esac
          tag_version="${TAG#v}"
          if [ "$code_version" != "$tag_version" ]; then
            echo "::error::La version demandée ($TAG) ne correspond pas à celle de Cargo.toml ($code_version)."
            exit 1
          fi
      - name: La clé privée de signature est configurée
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Le secret TAURI_SIGNING_PRIVATE_KEY est absent (Settings → Secrets and variables → Actions)."
            exit 1
          fi

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Tests avant publication
        run: |
          npm test
          cargo test --workspace
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Classeur URSSAF ${{ env.TAG }}
          releaseBody: |
            Installez la version correspondant à votre système (voir les fichiers ci-dessous).
            Les applications déjà installées proposent la mise à jour automatiquement.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
