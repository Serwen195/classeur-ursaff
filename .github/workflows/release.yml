name: Release

# Publier une version : mettre à jour `version` dans Cargo.toml ([workspace.package]), commiter,
# puis créer et pousser le tag correspondant :  git tag v0.2.0 && git push origin v0.2.0
# Le workflow compile les installeurs (Windows, macOS Intel + Apple Silicon, Linux), signe les
# mises à jour et prépare une release **brouillon** : relisez-la puis cliquez sur « Publish ».
# Les applications installées ne voient la nouvelle version qu'après cette publication.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La clé publique de l'updater a bien été renseignée
        run: |
          if grep -q "REMPLACER_PAR_LA_CLE_PUBLIQUE" src-tauri/tauri.conf.json; then
            echo "::error file=src-tauri/tauri.conf.json::Remplacez 'pubkey' par la clé publique générée avec 'npx tauri signer generate' (voir docs/developpement.md)."
            exit 1
          fi
      - name: Le tag correspond à la version du code
        run: |
          code_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$code_version" != "$tag_version" ]; then
            echo "::error::Le tag ($GITHUB_REF_NAME) ne correspond pas à la version de Cargo.toml ($code_version)."
            exit 1
          fi
      - name: La clé privée de signature est configurée
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Le secret TAURI_SIGNING_PRIVATE_KEY est absent (Settings → Secrets and variables → Actions)."
            exit 1
          fi

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Tests avant publication
        run: |
          npm test
          cargo test --workspace
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Classeur URSSAF ${{ github.ref_name }}
          releaseBody: |
            Installez la version correspondant à votre système (voir les fichiers ci-dessous).
            Les applications déjà installées proposent la mise à jour automatiquement.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
