[package]
name = "classeur-core"
description = "Cœur de Classeur URSSAF : chiffrement, coffre, stockage et synchronisation Git (sans dépendance à Tauri)."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.23"
getrandom = "0.4"
git2 = { version = "0.21", default-features = false, features = ["https"] }
hex = "0.4"
hkdf = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
