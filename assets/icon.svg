<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f2a6b"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6ff"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- classeur : dos + feuillets + couverture -->
  <rect x="244" y="196" width="536" height="632" rx="44" fill="#0b1f55" opacity=".55" transform="translate(14 18)"/>
  <rect x="244" y="196" width="536" height="632" rx="44" fill="url(#cover)"/>
  <rect x="244" y="196" width="120" height="632" rx="44" fill="#93b4ff"/>
  <rect x="320" y="196" width="44" height="632" fill="#93b4ff"/>
  <g fill="#0f2a6b">
    <circle cx="304" cy="334" r="26"/>
    <circle cx="304" cy="512" r="26"/>
    <circle cx="304" cy="690" r="26"/>
  </g>
  <!-- lignes de la page -->
  <g stroke="#9db4e8" stroke-width="22" stroke-linecap="round">
    <line x1="430" y1="320" x2="700" y2="320"/>
    <line x1="430" y1="408" x2="700" y2="408"/>
    <line x1="430" y1="496" x2="620" y2="496"/>
  </g>
  <!-- cadenas : données chiffrées -->
  <g transform="translate(560 560)">
    <path d="M44 100 V70 a66 66 0 0 1 132 0 V100" fill="none" stroke="#0f2a6b" stroke-width="30" stroke-linecap="round"/>
    <rect x="12" y="92" width="196" height="150" rx="34" fill="#16a34a"/>
    <circle cx="110" cy="152" r="20" fill="#ffffff"/>
    <rect x="101" y="160" width="18" height="46" rx="9" fill="#ffffff"/>
  </g>
</svg>
